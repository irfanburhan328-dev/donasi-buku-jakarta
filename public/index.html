<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donasi Buku Jakarta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
  
  <!-- Navbar -->
  <nav class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto">
    <div class="flex items-center space-x-2 text-xl font-bold">
      <span>📚</span>
      <span>DonasiBukuJakarta</span>
    </div>
    <div class="hidden md:flex space-x-6 text-sm text-gray-300">
      <a href="#dampak" class="hover:text-white transition">Dampak</a>
      <a href="/admin.html" class="text-amber-400 hover:underline font-semibold">Admin Dashboard</a>
    </div>
    <div>
      <a href="#donasi-form" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg transition">
        Donasi Sekarang
      </a>
    </div>
  </nav>

  <!-- Hero / Dampak Section -->
  <section id="dampak" class="py-16 px-6 max-w-7xl mx-auto text-center">
    <h2 class="text-3xl md:text-4xl font-bold text-amber-400 mb-3">Dampak & Transparansi</h2>
    <p class="text-gray-400 mb-12 max-w-xl mx-auto">Jejak kebaikan warga Jakarta yang telah tersalurkan secara nyata.</p>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Card 1: Buku Terkumpul -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
        <div id="stat-buku" class="text-4xl font-extrabold text-cyan-400 mb-2">0+</div>
        <div class="text-gray-400 text-sm">Buku Terkumpul</div>
      </div>
      <!-- Card 2: Donatur Bergabung -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
        <div id="stat-donatur" class="text-4xl font-extrabold text-amber-400 mb-2">0+</div>
        <div class="text-gray-400 text-sm">Donatur Bergabung</div>
      </div>
      <!-- Card 3: TBM Terbantu -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
        <div id="stat-tbm" class="text-4xl font-extrabold text-emerald-400 mb-2">24</div>
        <div class="text-gray-400 text-sm">TBM / Sekolah Terbantu</div>
      </div>
      <!-- Card 4: Wilayah Kota -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
        <div id="stat-wilayah" class="text-4xl font-extrabold text-purple-400 mb-2">5</div>
        <div class="text-gray-400 text-sm">Wilayah Kota DKI</div>
      </div>
    </div>
  </section>

  <!-- Form Donasi Section -->
  <section id="donasi-form" class="py-16 px-6 max-w-3xl mx-auto bg-slate-800 rounded-2xl shadow-xl my-12 border border-slate-700">
    <h2 class="text-2xl font-bold text-center text-amber-400 mb-6">Formulir Donasi Buku</h2>
    <form id="donationForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
        <input type="text" id="nama" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Nomor HP / WhatsApp</label>
          <input type="text" id="nomor_hp" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Judul Buku</label>
          <input type="text" id="judul_buku" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Jumlah Buku</label>
          <input type="number" id="jumlah_buku" min="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Kategori Buku</label>
        <input type="text" id="kategori_buku" placeholder="Misal: Pelajaran, Novel, Anak-anak" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Alamat Penjemputan</label>
        <textarea id="alamat_penjemputan" rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition">
        Kirim Donasi Buku
      </button>
    </form>
  </section>

  <!-- Script Dinamis untuk Statistik & Form -->
  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const result = await res.json();
        if (result.success) {
          document.getElementById('stat-buku').innerText = result.data.totalBuku + '+';
          document.getElementById('stat-donatur').innerText = result.data.totalDonatur + '+';
        }
      } catch (err) {
        console.error('Gagal memuat statistik:', err);
      }
    }

    document.getElementById('donationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        nama: document.getElementById('nama').value,
        email: document.getElementById('email').value,
        nomor_hp: document.getElementById('nomor_hp').value,
        judul_buku: document.getElementById('judul_buku').value,
        jumlah_buku: document.getElementById('jumlah_buku').value,
        kategori_buku: document.getElementById('kategori_buku').value,
        alamat_penjemputan: document.getElementById('alamat_penjemputan').value,
      };

      try {
        const res = await fetch('/api/donations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) {
          alert(result.message);
          document.getElementById('donationForm').reset();
          loadStats(); // Perbarui statistik secara otomatis setelah donasi masuk
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan.');
      }
    });

    // Panggil fungsi saat halaman pertama kali dibuka
    document.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
